name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests (with coverage thresholds)
        run: npm run test:coverage
        env:
          # Vitest also sets these internally; provided here so any import-time
          # config (fail-fast on JWT_SECRET) is satisfied in CI as well.
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-please-ignore-0123456789-abcdefghijklmnop
